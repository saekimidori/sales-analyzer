<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Sales data analysis dashboard">
        <meta name="keywords" content="sales, analysis, dashboard">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sales Analyzer</title>

        <!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <nav></nav>
        </header>

        <main>
            <section>
                <table class="dashboard">
                    <thead class="header">
                        <tr>
                            <th>Sales Data Analysis</th>
                        </tr>
                        <tr>
                            <td>Performance Dashboard</td>
                        </tr>
                        <tr>
                            <th>Overview</th>
                            <td class="date">September 2026</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <h2>Total revenue</h2>
                                <p id="total-revenue"></p>
                                <p>+8.2%</p>
                            </td>
                            <td>
                                <h2>Transactions</h2>
                                <p id="total-transactions"></p>
                                <p>Sales recorded</p>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <h2>Average sale</h2>
                                <p id="average-transaction"></p>
                                <p>Per transaction</p>
                            </td>
                            <td>
                                <h2>Top product</h2>
                                <p id="top-product"></p>
                                <p>Highest revenue</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <table>
                    <thead class="header">
                        <tr>
                            <th colspan="3">Sales by category</th>
                        </tr>
                    </thead>
                    <tbody id="category-sales">
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3">Illustrative design with sample data—not actual sales figures.</td>
                        </tr>
                    </tfoot>
                </table>
            </section>
        </main>
    
        <footer>

        </footer>

        <script type="text/javascript" src="sales-analyzer.js"></script>
    </body>
</html>
